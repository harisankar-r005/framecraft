name: Extension parity

on:
  push:
    branches: [aman-works]
  pull_request:

jobs:
  verify-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node ad-template-studio/tools/build-extension.cjs
      - run: node ad-template-studio/tests/extension-package.cjs
